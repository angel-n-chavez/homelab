apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mealie
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - image: ghcr.io/mealie-recipes/mealie:v3.28.0
          name: mealie
          ports:
            - containerPort: 9000
          env:
            - name: BASE_URL
              value: "http://ml.angelchavez.net" # Set to https:// if you have TLS termination handled upstream
            - name: ALLOW_META_TAGS
              value: "true"
          volumeMounts:
            - mountPath: "/app/data"
              name: mealie-data
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
