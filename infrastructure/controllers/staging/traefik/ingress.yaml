apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard
  namespace: kube-system # <--- Crucial: Traefik's default k3s namespace
spec:
  ingressClassName: traefik
  rules:
    - host: traefik.angelchavez.net # Or use a local domain like traefik.local
      http:
        paths:
          - backend:
              service:
                name: api@internal # Traefik's special built-in dashboard service
                port:
                  name: traefik
            path: /
            pathType: Prefix
